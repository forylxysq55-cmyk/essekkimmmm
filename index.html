<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Çiçeği Herkes Alır Hayatım</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600&display=swap" rel="stylesheet">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: radial-gradient(circle at 50% 30%, #15052a 0%, #030108 100%);
      font-family: 'Caveat', cursive;
      position: relative;
    }

    /* Üst Yazı */
    .title {
      position: absolute;
      top: 4%;
      left: 50%;
      transform: translateX(-50%);
      color: #c084fc;
      font-size: 2.3rem;
      text-align: center;
      width: 90%;
      z-index: 10;
      text-shadow: 0 0 15px rgba(192, 132, 252, 0.8), 0 0 30px rgba(147, 51, 234, 0.6);
      pointer-events: none;
      user-select: none;
    }

    canvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    /* Dokunma Kalpleri */
    .heart {
      position: absolute;
      color: #c084fc;
      font-size: 20px;
      pointer-events: none;
      user-select: none;
      animation: heartAnim 1.2s cubic-bezier(0.25, 1, 0.5, 1) forwards;
      transform-origin: center center;
      text-shadow: 0 0 12px rgba(192, 132, 252, 0.9);
      z-index: 20;
    }

    @keyframes heartAnim {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(0.3);
      }
      50% {
        opacity: 0.9;
        transform: translate(-50%, -60px) scale(1.6);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -120px) scale(2.4);
      }
    }
  </style>
</head>
<body>

  <h1 class="title">Çiçeği herkes alır hayatım</h1>
  <canvas id="canvas"></canvas>

  <script>
    const canvas = document.getElementById('canvas');
    const ctx = canvas.getContext('2d');

    let w, h;
    let stars = [];
    let stemsData = [];
    let time = 0;

    function init() {
      w = canvas.width = window.innerWidth || document.documentElement.clientWidth || document.body.clientWidth;
      h = canvas.height = window.innerHeight || document.documentElement.clientHeight || document.body.clientHeight;
      
      // Arka plan yıldızları
      stars = [];
      const count = Math.floor((w * h) / 3200);
      for (let i = 0; i < count; i++) {
        stars.push({
          x: Math.random() * w,
          y: Math.random() * h,
          r: Math.random() * 1.5 + 0.3,
          a: Math.random() * 0.7 + 0.3
        });
      }

      // Yoğun Lilyum Demeti Yapısı (16 Adet Gerçekçi Çiçek Başlığı)
      const centerX = w / 2;
      const spreadX = Math.min(w * 0.45, 200);
      stemsData = [];

      for (let i = 0; i < 16; i++) {
        // Çiçeklerin yerleşim haritası (kavisli demet görünümü)
        const offsetRatio = (i / 15) - 0.5; 
        const targetX = centerX + offsetRatio * spreadX * 2 + (Math.random() - 0.5) * 30;
        const targetY = h * 0.32 + Math.abs(offsetRatio) * (h * 0.22) + (Math.random() - 0.5) * 40;
        
        stemsData.push({
          x: targetX,
          y: targetY,
          scale: 0.75 + Math.random() * 0.35,
          isStar: i % 3 === 0, // Her 3 çiçekten biri yıldızlı
          swayOffset: Math.random() * Math.PI * 2,
          swaySpeed: 1 + Math.random() * 0.8
        });
      }
    }

    // Yıldızları Çiz
    function drawStars() {
      ctx.fillStyle = '#ffffff';
      stars.forEach(s => {
        ctx.globalAlpha = s.a;
        ctx.beginPath();
        ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
        ctx.fill();
      });
      ctx.globalAlpha = 1;
    }

    // Az sayıda zarif zemin otları
    function drawGrass() {
      const grassCount = Math.min(10, Math.floor(w / 40));
      ctx.strokeStyle = '#2b0947';
      ctx.lineWidth = 2.5;
      ctx.lineCap = 'round';

      for (let i = 0; i < grassCount; i++) {
        const x = (w / (grassCount + 1)) * (i + 1);
        const gh = 70 + (i % 3) * 35;
        const curve = (i % 2 === 0 ? 1 : -1) * 25 + Math.sin(time + i) * 5;

        ctx.beginPath();
        ctx.moveTo(x, h);
        ctx.quadraticCurveTo(x + curve, h - gh / 2, x + curve * 1.2, h - gh);
        ctx.stroke();
      }
    }

    // Gerçekçi Lilyum (Zambak) Çiçeği Çizimi
    function drawLilyum(cx, cy, scale, isStar, swayX) {
      ctx.save();
      ctx.translate(cx + swayX, cy);
      ctx.scale(scale, scale);

      // Çiçek Dış Glow Parlaklığı
      ctx.shadowColor = isStar ? '#d8b4fe' : '#a855f7';
      ctx.shadowBlur = 18;

      const petals = 6;
      const angleStep = (Math.PI * 2) / petals;

      // 1. Katman: Dış Taç Yapraklar (Kıvrımlı Lilyum Yaprağı Formu)
      for (let i = 0; i < petals; i++) {
        const angle = i * angleStep;
        ctx.save();
        ctx.rotate(angle);

        ctx.beginPath();
        ctx.moveTo(0, 0);
        // Lilyum sivri ve kıvrımlı yaprak çimimi
        ctx.bezierCurveTo(-14, -25, -18, -55, 0, -68);
        ctx.bezierCurveTo(18, -55, 14, -25, 0, 0);

        const grad = ctx.createLinearGradient(0, 0, 0, -68);
        grad.addColorStop(0, '#581c87');
        grad.addColorStop(0.4, '#9333ea');
        grad.addColorStop(0.8, '#c084fc');
        grad.addColorStop(1, '#f3e8ff');

        ctx.fillStyle = grad;
        ctx.fill();

        // Yaprak Ortası Damarı
        ctx.beginPath();
        ctx.moveTo(0, -5);
        ctx.lineTo(0, -55);
        ctx.strokeStyle = 'rgba(233, 213, 255, 0.4)';
        ctx.lineWidth = 1.5;
        ctx.stroke();

        ctx.restore();
      }

      // 2. Katman: Lilyum Erkek Organları (Stamens - 6 Adet)
      for (let i = 0; i < 6; i++) {
        const angle = i * (Math.PI / 3) + Math.PI / 6;
        const stamenLen = 28;
        const sx = Math.cos(angle) * stamenLen;
        const sy = Math.sin(angle) * stamenLen;

        // Sap
        ctx.beginPath();
        ctx.moveTo(0, 0);
        ctx.lineTo(sx, sy);
        ctx.strokeStyle = '#e9d5ff';
        ctx.lineWidth = 1.2;
        ctx.stroke();

        // Başçık (Anther)
        ctx.beginPath();
        ctx.arc(sx, sy, 2.5, 0, Math.PI * 2);
        ctx.fillStyle = '#fde047'; // Sarı parlak tohum başı
        ctx.shadowColor = '#fde047';
        ctx.shadowBlur = 8;
        ctx.fill();
      }

      // 3. Katman: Yıldızlı Çiçek ise Merkeze Yıldız Işığı
      if (isStar) {
        ctx.save();
        ctx.fillStyle = '#ffffff';
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = 15;
        ctx.beginPath();
        for (let i = 0; i < 4; i++) {
          ctx.rotate(Math.PI / 2);
          ctx.lineTo(0, 16);
          ctx.quadraticCurveTo(0, 0, 4, 0);
        }
        ctx.fill();
        ctx.restore();
      } else {
        // Normal Çiçek Göbeği
        ctx.beginPath();
        ctx.arc(0, 0, 4, 0, Math.PI * 2);
        ctx.fillStyle = '#ffffff';
        ctx.fill();
      }

      ctx.restore();
    }

    // Sallanan Demeti Çiz
    function drawBouquet() {
      const centerX = w / 2;
      const startY = h + 30;

      ctx.strokeStyle = '#4c1d95';
      ctx.lineWidth = 2.8;
      ctx.lineCap = 'round';

      // 1. Sapları Çiz (Hafif Rüzgar Esintisiyle Eğilen Gövdeler)
      stemsData.forEach(s => {
        const sway = Math.sin(time * s.swaySpeed + s.swayOffset) * 12;

        ctx.beginPath();
        ctx.moveTo(centerX, startY);
        ctx.quadraticCurveTo(
          centerX + (s.x - centerX) * 0.3 + sway * 0.5,
          startY - (startY - s.y) * 0.5,
          s.x + sway,
          s.y
        );
        ctx.stroke();
      });

      // 2. Lilyum Çiçeklerini Çiz
      stemsData.forEach(s => {
        const sway = Math.sin(time * s.swaySpeed + s.swayOffset) * 12;
        drawLilyum(s.x, s.y, s.scale, s.isStar, sway);
      });
    }

    // Ana Animasyon Döngüsü (Yüksek Performans)
    function animate() {
      time += 0.025; // Sallanma hızı

      ctx.clearRect(0, 0, w, h);
      drawStars();
      drawGrass();
      drawBouquet();

      requestAnimationFrame(animate);
    }

    // Dokunma Kalpleri
    function spawnHeart(e) {
      const clientX = e.touches ? e.touches[0].clientX : e.clientX;
      const clientY = e.touches ? e.touches[0].clientY : e.clientY;

      const heart = document.createElement('div');
      heart.className = 'heart';
      heart.innerHTML = '♥';
      heart.style.left = `${clientX}px`;
      heart.style.top = `${clientY}px`;

      document.body.appendChild(heart);

      setTimeout(() => heart.remove(), 1200);
    }

    // Event Dinleyicileri
    window.addEventListener('resize', () => {
      init();
    });

    window.addEventListener('click', spawnHeart);
    window.addEventListener('touchstart', spawnHeart, { passive: true });

    // Başlat
    init();
    animate();
  </script>
</body>
</html>
